<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FallenFeather</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&display=swap');

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    background:#000;
    color:#fff;
    font-family:'Orbitron',sans-serif;
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    overflow:hidden;
}

/* Animated Grid */
body::before{
    content:"";
    position:fixed;
    inset:0;
    background:
    linear-gradient(rgba(255,255,255,.08) 1px, transparent 1px),
    linear-gradient(90deg, rgba(255,255,255,.08) 1px, transparent 1px);
    background-size:40px 40px;
    animation:gridMove 15s linear infinite;
}

@keyframes gridMove{
    from{transform:translateY(0);}
    to{transform:translateY(40px);}
}

/* Floating stars */
.star{
    position:absolute;
    color:white;
    animation:float 8s linear infinite;
    opacity:.5;
}

@keyframes float{
    from{
        transform:translateY(100vh);
    }
    to{
        transform:translateY(-100px);
    }
}

.card{
    width:90%;
    max-width:650px;
    background:rgba(255,255,255,.05);
    border:2px solid white;
    border-radius:25px;
    padding:45px;
    text-align:center;
    backdrop-filter:blur(10px);
    box-shadow:
    0 0 20px rgba(255,255,255,.5),
    inset 0 0 20px rgba(255,255,255,.1);
    z-index:1;
}

.logo{
    font-size:50px;
    font-weight:900;
    letter-spacing:4px;
    text-shadow:
    0 0 10px #fff,
    0 0 20px #fff;
}

.line{
    width:100px;
    height:2px;
    background:white;
    margin:15px auto 25px;
}

.title{
    font-size:22px;
    margin-bottom:5px;
}

.subtitle{
    font-size:12px;
    opacity:.7;
    margin-bottom:35px;
}

.btn{
    display:block;
    text-decoration:none;
    color:black;
    background:white;
    padding:16px;
    margin:15px 0;
    border-radius:14px;
    font-weight:700;
    transition:.3s;
    border:2px solid white;
}

.btn:hover{
    background:black;
    color:white;
    transform:scale(1.03);
    box-shadow:0 0 20px white;
}

.footer{
    margin-top:25px;
    font-size:11px;
    opacity:.5;
}
</style>
</head>

<body>

<div class="star" style="left:10%;animation-delay:0s;">✦</div>
<div class="star" style="left:30%;animation-delay:2s;">✦</div>
<div class="star" style="left:50%;animation-delay:4s;">✦</div>
<div class="star" style="left:70%;animation-delay:1s;">✦</div>
<div class="star" style="left:90%;animation-delay:3s;">✦</div>

<div class="card">
    <div class="logo">FALLENFEATHER</div>

    <div class="line"></div>

    <div class="title">JOIN TO OUR GROUP NOW</div>
    <div class="subtitle">hiring moderator</div>

    <a class="btn" href="https://discord.gg/M8Azvq38X" target="_blank">
        💬 DISCORD SERVER
    </a>

    <a class="btn" href="https://roblox.com.bz/communities/359046182//" target="_blank">
        🎮 ROBLOX GROUP
    </a>

    <div class="footer">
        © 2026 FALLENFEATHER COMMUNITY
    </div>
</div>

</body>
</html>
